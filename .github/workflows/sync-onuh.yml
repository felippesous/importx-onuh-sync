name: Sincronizar Onuh -> ImportX (diário)
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt && playwright install chromium --with-deps
      - name: Rodar robô Onuh
        env:
          ONUH_COOKIES_JSON: ${{ secrets.ONUH_COOKIES_JSON }}
        run: python onuh_scraper.py
      - name: Commitar produtos.json atualizado
        run: |
          git config user.name "importx-bot"
          git config user.email "bot@importx.com.br"
          git add data/produtos.json data/variacao_precos.csv
          git commit -m "sync onuh $(date +%F_%H:%M)" || echo "sem mudanças"
          git push
