name: Sincronizar Onuh -> ImportX
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      teste_rapido:
        description: 'Teste rapido (so Asad, 3 min)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Validar codigo antes de rodar
        run: python validate.py
      - name: Rodar robo
        env:
          ONUH_COOKIES_JSON: ${{ secrets.ONUH_COOKIES_JSON }}
          TESTE_RAPIDO: ${{ inputs.teste_rapido == 'true' && '1' || '0' }}
        run: python onuh_scraper.py
      - name: Commit produtos.json
        run: |
          git config user.name "importx-bot"
          git config user.email "bot@importx.local"
          git add data/produtos.json
          git diff --cached --quiet || git commit -m "sync: atualizar precos"
          git push
